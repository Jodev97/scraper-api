# Production layout. No port is published to the host: Nopxus reaches
# scraper-api over the shared `dokploy-network` network.
#
#   docker network create dokploy-network      # only if Nopxus' stack has not created it
#   cp .env.example .env && $EDITOR .env
#   docker compose up -d --build

services:
  scraper-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - scraper_redis_data:/data
    networks: [scraper]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scraper-api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      PORT: "3000"
      REDIS_URL: redis://scraper-redis:6379
    depends_on:
      scraper-redis:
        condition: service_healthy
    networks:
      scraper: {}
      dokploy-network:
        # Unique DNS name on the shared network (plain service names like
        # `scraper-api` / `app` can collide with other Dokploy projects).
        aliases: [nopxus-scraper-api]
    restart: unless-stopped
    stop_grace_period: 10s
    # `expose` only documents the port inside the Docker networks.
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  scraper-worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      REDIS_URL: redis://scraper-redis:6379
    depends_on:
      scraper-redis:
        condition: service_healthy
    # Only on the private `scraper` network: no route to Nopxus.
    networks: [scraper]
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 40s # SIGTERM: 30 s of drain, then the rest is failed
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    healthcheck:
      test: ["CMD", "node", "dist/worker/healthcheck.js"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  dokploy-network:
    external: true
  scraper: {}

volumes:
  scraper_redis_data: {}
